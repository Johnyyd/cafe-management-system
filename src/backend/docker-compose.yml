version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cafe_management_mongodb
    ports:
      - "7891:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cafe_management
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: cafe_management_seq
    ports:
      - "7892:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5341/api/health"]
      interval: 60s
      timeout: 15s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe_management_api
    ports:
      - "7890:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__MongoDB: "mongodb://mongodb:27017"
      ConnectionStrings__DatabaseName: "cafe_management"
      Seq__ServerUrl: "http://seq:80"
      Jwt__Key: "${JWT_KEY:-your-super-secret-key-min-32-chars-change-in-production}"
      Jwt__Issuer: "cafe-management"
      Jwt__Audience: "cafe-management-client"
      RateLimiting__DefaultPermitLimit: "100"
      RateLimiting__DefaultWindowSeconds: "60"
      Serilog__MinimumLevel: "Information"
    depends_on:
      mongodb:
        condition: service_healthy
      seq:
        condition: service_healthy
    # volumes:
    #   - ./src/backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:
  seq_data: